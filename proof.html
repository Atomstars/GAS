<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>GAS — material proof</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #03040a; }
  body {
    font-family: ui-monospace, 'SF Mono', Menlo, monospace;
    color: #e8eeff; touch-action: none; -webkit-font-smoothing: antialiased;
  }
  #stage { position: fixed; inset: 0; display: block; }

  #boot {
    position: fixed; inset: 0; z-index: 9; display: grid; place-items: center;
    background: #03040a; font-size: 11px; letter-spacing: .4em; color: #4e5878;
    transition: opacity .7s ease;
  }
  #boot.gone { opacity: 0; pointer-events: none; }

  #label {
    position: fixed; z-index: 10;
    left: 50%; transform: translateX(-50%);
    bottom: calc(env(safe-area-inset-bottom, 0px) + 46px);
    font-size: 10px; letter-spacing: .55em; color: #93a2c8;
    pointer-events: none;
  }
  #label.flash { animation: flash .5s ease; }
  @keyframes flash { from { color: #fff; } to { color: #93a2c8; } }

  #hint {
    position: fixed; z-index: 10;
    left: 50%; transform: translateX(-50%);
    bottom: calc(env(safe-area-inset-bottom, 0px) + 22px);
    font-size: 9px; letter-spacing: .32em; color: #3d465f;
    pointer-events: none;
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="boot">LOADING</div>
<div id="label"></div>
<div id="hint">TAP TO CHANGE MATERIAL</div>
<script type="module" src="/src/proof/liquid.js"></script>
</body>
</html>
