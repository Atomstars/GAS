<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GAS — Akash</title>
<meta name="description" content="GAS — the work of Akash. A film, not a page." />
<meta name="theme-color" content="#01010a" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Space+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/style.css" />
</head>
<body>

<canvas id="stage"></canvas>

<!-- projection warm-up -->
<div id="boot"><span></span></div>

<!-- FRAME 01 — type sits under the word, inside the letterbox safe area -->
<div id="hud">
  <p class="line tagline">A · K · A · S · H&nbsp;&nbsp;—&nbsp;&nbsp;Sanskrit for <em>the sky</em></p>
  <p class="line sub">Everything begins as gas.</p>
  <div class="line hint">
    <span class="hint-text">SCROLL&nbsp;TO&nbsp;TRAVEL</span>
    <span class="hint-rule"></span>
  </div>
</div>

<!-- END OF THE BUILT ROUTE (Phase 1) -->
<div id="endcard">
  <p class="tagline">FRAME 01 · GAS</p>
  <h2>The route continues.</h2>
  <p class="sub">The remaining frames — the craft, the work, and every project
     as its own world — are being shot next.</p>
  <p class="hint-text back">scroll back up to run the frame again</p>
</div>

<!-- passive progress; there is nothing to click in this film -->
<div id="rail"><div id="rail-line"><div id="rail-fill"></div></div></div>

<div id="cursor"></div>
<div id="cursor-dot"></div>

<noscript><p style="color:#eaf0ff;padding:24px;font-family:sans-serif">GAS is a real-time WebGL film. Please enable JavaScript.</p></noscript>

<script type="module" src="/src/main.js"></script>
</body>
</html>
